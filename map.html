<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviation Map - Calico Aeronautics</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<div id="site-header"></div>

<main class="container">
  <section class="page-hero">
    <h1>Where Aviation History Happened</h1>
    <p>14 real locations where aviation history actually happened. Click a marker (or a card in list view) for the details.</p>
  </section>

  <section style="padding-top:0;">
    <div class="view-toggle">
      <button id="view-map-btn" type="button">Map View</button>
      <button id="view-list-btn" type="button">List View</button>
    </div>
    <div id="leaflet-map"></div>
    <div id="discovery-list-view" style="display:none;"></div>
  </section>
</main>

<div id="site-footer"></div>

<div class="modal-overlay" id="map-modal">
  <div class="modal-box">
    <button class="modal-close" id="map-modal-close" aria-label="Close">&times;</button>
    <div id="map-modal-body"></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="js/map.js"></script>
</body>
</html>
