<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Map - Calico Physics</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="container">
  <section class="page-hero">
    <span class="eyebrow">Geography of ideas</span>
    <h1>Where Discoveries Happened</h1>
    <p>Click a pin to see who worked there and what they're known for.</p>
  </section>

  <section style="padding-top:0;">
    <div class="map-panel" id="map-panel"></div>
  </section>
</main>

<div id="site-footer"></div>

<div class="modal-overlay" id="map-modal">
  <div class="modal-box">
    <button class="modal-close" id="map-modal-close" aria-label="Close">&times;</button>
    <div id="map-modal-body"></div>
  </div>
</div>

<script src="js/layout.js"></script>
<script src="js/background.js"></script>
<script src="js/cat.js"></script>
<script src="js/map.js"></script>
</body>
</html>
